# Nginx reverse proxy configuration for QafNest on Hetzner VPS (Ubuntu/Debian)
# Routes:
#   https://qafnest.com            -> Guest portal (:3000)
#   https://qafnest.com/admin      -> Admin portal (:3003, basePath: /admin)
#   https://qafnest.com/cms        -> CMS portal (:3002, basePath: /cms)
#   https://business.qafnest.com   -> Host portal (:3001)
#
# Install on Ubuntu:
#   sudo cp deploy/nginx/qafnest.conf /etc/nginx/sites-available/qafnest
#   sudo ln -sf /etc/nginx/sites-available/qafnest /etc/nginx/sites-enabled/qafnest
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d qafnest.com -d www.qafnest.com -d business.qafnest.com

upstream qafnest_guest {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream qafnest_host {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream qafnest_cms {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream qafnest_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name qafnest.com www.qafnest.com;

    client_max_body_size 25M;

    # Admin Portal (basePath: /admin)
    location = /admin {
        proxy_pass http://qafnest_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /admin/ {
        proxy_pass http://qafnest_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # CMS Portal (basePath: /cms)
    location = /cms {
        proxy_pass http://qafnest_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /cms/ {
        proxy_pass http://qafnest_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Guest Storefront (default)
    location / {
        proxy_pass http://qafnest_guest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name business.qafnest.com;

    client_max_body_size 25M;

    # Host Portal
    location / {
        proxy_pass http://qafnest_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

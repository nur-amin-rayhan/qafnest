# Nginx reverse proxy configuration for QafNest on Hetzner VPS (Subdomain Isolation)
# Routes:
#   https://qafnest.com            -> Guest portal (:3000)
#   https://business.qafnest.com   -> Host portal  (:3001)
#   https://cms.qafnest.com        -> CMS portal   (:3002)
#   https://admin.qafnest.com      -> Admin portal (:3003)
#
# Install on Ubuntu:
#   sudo cp deploy/nginx/qafnest.conf /etc/nginx/sites-available/qafnest
#   sudo ln -sf /etc/nginx/sites-available/qafnest /etc/nginx/sites-enabled/qafnest
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d qafnest.com -d www.qafnest.com -d business.qafnest.com -d cms.qafnest.com -d admin.qafnest.com

# Real client IP defaults strictly to the TCP peer address ($remote_addr) so
# untrusted clients cannot spoof X-Real-IP via CF-Connecting-IP headers.
# If deployed exclusively behind Cloudflare/trusted proxies, enable ngx_http_realip_module:
#   real_ip_header CF-Connecting-IP;
#   # set_real_ip_from <cloudflare-cidr>;
proxy_hide_header X-Powered-By;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# Enable once TLS/HTTPS termination is active on port 443:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

upstream qafnest_guest {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream qafnest_host {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream qafnest_cms {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream qafnest_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

# Guest Storefront (qafnest.com)
server {
    listen 80;
    listen [::]:80;
    server_name qafnest.com www.qafnest.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://qafnest_guest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Host Business Portal (business.qafnest.com)
server {
    listen 80;
    listen [::]:80;
    server_name business.qafnest.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://qafnest_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# CMS Editorial Portal (cms.qafnest.com)
server {
    listen 80;
    listen [::]:80;
    server_name cms.qafnest.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://qafnest_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Super Admin Portal (admin.qafnest.com)
server {
    listen 80;
    listen [::]:80;
    server_name admin.qafnest.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://qafnest_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
